<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071d38" />
  <title>NyalaLagi — Offline</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#142033}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,rgba(255,210,26,.19),transparent 34%),linear-gradient(160deg,#f8fbff,#eef3f8)}.card{width:min(480px,100%);padding:34px 28px;border-radius:28px;text-align:center;background:rgba(255,255,255,.83);border:1px solid rgba(255,255,255,.96);box-shadow:0 30px 80px rgba(7,29,56,.13);backdrop-filter:blur(20px)}img{width:88px;height:88px;border-radius:24px;box-shadow:0 15px 35px rgba(7,29,56,.17)}h1{font-size:28px;margin:22px 0 10px;letter-spacing:-.03em}p{margin:0 auto 24px;max-width:350px;color:#657083;line-height:1.7;font-size:14px}.status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#fff5c9;color:#715a00;font-size:12px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#e5ad00}button{width:100%;border:0;border-radius:15px;padding:14px 18px;background:#071d38;color:#fff;font-weight:850;font-size:14px;cursor:pointer}small{display:block;margin-top:16px;color:#8a94a3;line-height:1.5}</style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="NyalaLagi" />
    <h1>Koneksi sedang terputus</h1>
    <p>NyalaLagi tidak dapat mengambil data terbaru. Hubungkan kembali internet Anda, lalu coba lagi.</p>
    <div class="status"><span class="dot"></span> Mode offline</div>
    <div style="height:22px"></div>
    <button type="button" onclick="location.reload()">Coba Hubungkan Lagi</button>
    <small>Halaman laporan dan data akun tidak disimpan sebagai halaman offline demi menjaga data tetap segar dan aman.</small>
  </main>
</body>
</html>
